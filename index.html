<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#143c46" />
    <meta
      name="description"
      content="Shenton 的像素海岛。散步、跳跃、收集星光，在灯塔下发现一个小小的世界。"
    />
    <title>Star Isles — Shenton's Little World</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas
      id="game"
      aria-label="可探索的像素海岛，使用方向键移动，空格跳跃，E 交互"
      tabindex="0"
    ></canvas>
    <header>
      <a class="brand" href="#" id="home"
        ><span class="brand-icon">✦</span> STAR ISLES
        <small>SHENTON'S LITTLE WORLD</small></a
      >
      <nav>
        <button id="mapButton">地图 <kbd>M</kbd></button
        ><button id="soundButton" aria-pressed="false">声音：关</button
        ><button id="timeButton">日落</button
        ><button id="helpButton" aria-label="操作帮助">?</button
        ><a
          href="https://github.com/shentonyan"
          target="_blank"
          rel="noopener noreferrer"
          >GitHub ↗</a
        >
      </nav>
    </header>
    <section id="intro">
      <div class="eyebrow">A SMALL WORLD. A LITTLE WONDER.</div>
      <h1>在世界的边缘，<br />捡一颗<span>星星。</span></h1>
      <p>
        这里是 Shenton 的小小群岛。<br />没有倒计时，没有输赢。只有海风、远方和一点好奇心。
      </p>
      <button id="start" class="primary">开始漫游 <span>→</span></button>
      <div class="intro-note">方向键 / A D 移动 · 空格跳跃 · E 探索</div>
    </section>
    <aside id="location">
      <span class="location-mark">⌖</span>
      <div><small>YOU ARE HERE</small><strong id="place">风起码头</strong></div>
    </aside>
    <aside id="quest">
      <small>一封写给夜空的信</small>
      <div>
        <span id="starCount">✦ 0 / 12</span
        ><span id="questText">收集散落的星光，点亮远方的灯塔</span>
      </div>
      <div class="progress"><i id="progress"></i></div>
    </aside>
    <div id="prompt" hidden></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <footer>
      <span><i class="live-dot"></i> 一个可以慢慢走的地方</span
      ><span id="controls"
        >A D / ← → 移动 <b>·</b> SPACE 跳跃 <b>·</b> E 交互 <b>·</b> M
        地图</span
      ><span id="engine">RUST TERRAIN · CANVAS WORLD</span>
    </footer>
    <div id="touch">
      <button data-key="ArrowLeft" aria-label="向左">◀</button
      ><button data-key="ArrowRight" aria-label="向右">▶</button
      ><button data-key="KeyE" aria-label="交互">E</button
      ><button data-key="Space" aria-label="跳跃">↑</button>
    </div>
    <dialog id="panel">
      <button id="closePanel" aria-label="关闭">×</button>
      <div id="panelContent"></div>
    </dialog>
    <noscript
      >这个像素世界需要 JavaScript。你也可以直接访问
      <a href="https://github.com/shentonyan">Shenton 的 GitHub</a>。</noscript
    >
    <script type="module" src="src/game.js"></script>
  </body>
</html>
